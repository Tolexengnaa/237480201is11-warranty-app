# Một lệnh dựng cả hệ thống:  docker compose up -d --build   (xem docs/deployment-guide.md)
# Giao diện + API: http://localhost:3000   ·   Dừng: docker compose down   ·   Xoá cả dữ liệu: docker compose down -v
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartcrm
      POSTGRES_USER: smartcrm
      POSTGRES_PASSWORD: smartcrm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcrm -d smartcrm"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db            # tên service, không phải localhost
      DB_PORT: 5432
      DB_NAME: smartcrm
      DB_USER: smartcrm
      DB_PASSWORD: smartcrm
      APP_PORT: 3000
      # SECRET_KEY không ghi ở đây: để trống thì ứng dụng tự sinh khoá ngẫu nhiên (BUG-06).
      # Muốn đặt khoá riêng: tạo tệp .env cạnh tệp này với SECRET_KEY=<≥ 32 ký tự>.
      SECRET_KEY: ${SECRET_KEY:-}
      TOKEN_EXPIRES_IN: 8h
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 10

volumes:
  pgdata:
